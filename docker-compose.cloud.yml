# Cloud Docker production — uses MongoDB Atlas (no local MongoDB container)
# Requires MONGODB_URI in .env.production pointing to Atlas
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
